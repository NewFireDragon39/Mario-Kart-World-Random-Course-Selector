name: Build Windows EXE for 1.0.0

on:
  workflow_dispatch:
  push:
    tags:
      - '1.0.0'
      - 'v1.0.0'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Windows executable
        shell: powershell
        run: |
          python -m PyInstaller --onefile --name "Mario_Kart_World_Random_Course_Selector" v1.0.0.py
          Copy-Item -Path "dist\Mario_Kart_World_Random_Course_Selector.exe" -Destination "Mario_Kart_World_Random_Course_Selector.exe"

      - name: Upload EXE to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: '1.0.0'
          name: '1.0.0'
          files: Mario_Kart_World_Random_Course_Selector.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
